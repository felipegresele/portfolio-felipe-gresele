<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Felipe Gresele - Engenheiro de Software</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>
      // Aplica tema e idioma antes da primeira pintura para evitar "flash".
      (function () {
        try {
          var savedTheme = localStorage.getItem("portfolio-theme");
          if (savedTheme !== "light" && savedTheme !== "dark") {
            savedTheme = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.dataset.theme = savedTheme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
        try {
          var savedLang = localStorage.getItem("portfolio-lang");
          document.documentElement.lang = savedLang === "en" ? "en" : "pt-BR";
        } catch (e) {
          /* mantém o padrão */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
